name: client-smoke

# 无头客户端冒烟：xvfb + Mesa 软件渲染下真正启动一次 1.20.1 客户端。
#
# 目的不是帧率（软件渲染只有个位数 FPS，测不了性能），而是"改动有没有让客户端崩"：
# Mixin 是否应用、模组是否加载完成、窗口是否建起来。对渲染类改动，这能把"启动即崩"
# 这一档问题挡在合并之前；画面是否正确仍然需要实机看。
#
# 现在它是硬门禁：构建失败、客户端崩溃、没到主菜单都算失败。

on:
  workflow_dispatch:
  push:
    branches: [test/prone-anim-rework]

concurrency:
  group: client-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          # 缓存会连 neoform 的中间产物一起带走；CI 上曾因此出现
          # "Missing required MCP data: intermediateToNamed.zip" 的半成品状态。
          # 构建时间换正确性，等确认稳定后再开回。
          cache-disabled: true

      # moddev 在全新 runner 上可能不产出 MCP 映射包，SRG 重命名工具会直接崩。
      # 在 Gradle 启动前就位，配置阶段就已经能看到它。
      - name: Seed MCP mappings
        run: |
          mkdir -p build/moddev/artifacts
          if [ ! -f build/moddev/artifacts/intermediateToNamed.zip ]; then
            cp gradle/mcp/intermediateToNamed.zip build/moddev/artifacts/
          fi

      # 拉一次依赖，让 forge 构件落进 Gradle 缓存，然后把签名剥掉。
      # 不这么做的话，任何加载 net.minecraftforge.* 的 JVM（代码生成、JUnit）都可能
      # 抛 "SHA-384 digest error"——CI 上实际发生过两次。
      - name: Prefetch dependencies
        # dependencies 只解析元数据，必须真的跑一次编译/取产物，jar 才会落进缓存。
        run: ./gradlew --no-daemon -q compileJava > /dev/null 2>&1 || true

      - name: Strip jar signatures from Gradle cache
        run: python3 .github/scripts/strip-cache-signatures.py

      - name: Install headless GL stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1-mesa-dri libgl1 libglu1-mesa mesa-utils

      - name: Boot client until the main menu
        run: |
          set -o pipefail
          mkdir -p run/client_a
          # 客户端不会自己退出：跑到出现窗口与 OpenAL 初始化后由 timeout 结束。
          # timeout 的 124 是"跑够了"，其余非零都要查。
          set +e
          timeout --signal=TERM 600 xvfb-run -a -s "-screen 0 1280x720x24" \
            ./gradlew runClient -PkineticSmoke -Dorg.spongepowered.mixin.debug.verbose=true --console=plain 2>&1 | tee client.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ] && [ "$code" -ne 143 ]; then
            echo "::error::runClient 退出码 $code"
            exit 1
          fi

      - name: Fail on crash, require a started client
        run: |
          echo '--- 关键日志 ---'
          grep -E 'Backend library|OpenAL initialized|Created:|LWJGL|Minecraft has crashed|Minecraft Crash Report|Mixin' \
            client.log | tail -40 || true
          if grep -qE 'BUILD FAILED' client.log; then
            echo '::error::构建失败（客户端根本没起来）'
            exit 1
          fi
          if grep -qE 'Minecraft has crashed|---- Minecraft Crash Report ----' client.log; then
            echo '::error::客户端崩溃'
            exit 1
          fi
          if ! grep -qE 'OpenAL initialized|Created: [0-9]+x[0-9]+' client.log; then
            echo '::error::客户端未到达主菜单（没有窗口/音频初始化日志）'
            exit 1
          fi

      - name: Upload client log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-smoke-log
          path: |
            client.log
            run/client_a/logs/**
          if-no-files-found: warn

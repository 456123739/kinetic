name: verify

on:
  push:
    branches: [main, test/prone-anim-rework]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 构建 + 全量测试 + 文档自检。原生库随仓库提交，CI 直接指过去即可。
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          # 缓存会连 neoform 的中间产物一起带走；CI 上曾因此出现
          # "Missing required MCP data: intermediateToNamed.zip" 的半成品状态。
          # 构建时间换正确性，等确认稳定后再开回。
          cache-disabled: true

      - name: Documentation gate
        run: python3 docs/tools/check_docs.py

      - name: Build and test
        env:
          KINETIC_NATIVE_PATH: ${{ github.workspace }}/src/main/resources/META-INF/native/libkinetic.so
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: ./gradlew build --console=plain

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-jar
          path: build/libs/kinetic-*.jar
          if-no-files-found: error

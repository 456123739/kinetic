import com.kinetic.gradle.BuiltinModelToolTask

// CI 的 moddev 流水线在全新 runner 上偶尔不产出 MCP 映射包，SRG 重命名工具随即报
// "Missing required MCP data: intermediateToNamed.zip"。仓库里带了一份同版本产物，
// 缺失时补上；已存在则不覆盖（正常流水线优先）。
tasks.register('ensureMcpData') {
    def bundled = layout.projectDirectory.file('gradle/mcp/intermediateToNamed.zip')
    def target = layout.buildDirectory.file('moddev/artifacts/intermediateToNamed.zip')
    inputs.file(bundled)
    outputs.file(target)
    doLast {
        def destination = target.get().asFile
        if (destination.isFile()) {
            return
        }
        destination.parentFile.mkdirs()
        java.nio.file.Files.copy(bundled.asFile.toPath(), destination.toPath())
    }
}

tasks.matching { it.name == 'createMinecraftArtifacts' }.configureEach {
    dependsOn tasks.named('ensureMcpData')
}

sourceSets {
    builtinIndexTool {
        java.srcDir 'src/builtinIndexTool/java'
        compileClasspath += sourceSets.main.output.classesDirs + sourceSets.main.compileClasspath
        runtimeClasspath = output + sourceSets.main.output.classesDirs + configurations.runtimeClasspath
    }
}

sourceSets.test {
    compileClasspath += sourceSets.builtinIndexTool.output
    runtimeClasspath += sourceSets.builtinIndexTool.output
}

def builtinModelRoot = layout.projectDirectory.dir('src/main/resources/assets/kinetic/builtin')
// 内置模型库只保留 Steve/Alex；Steve 兼任 intrinsic default（共享动画提供者）。
// 必须与 BuiltinModelIndex.INTRINSIC_DEFAULT_PATH 保持一致。
def builtinDefaultRoot = builtinModelRoot.dir('misc/2_steve')
def builtinIntrinsicDefaultExclude = 'misc/2_steve/**'
def builtinAnimationHistory = layout.projectDirectory.file(
        'src/main/resources/assets/kinetic/default-animation-history.json')
def builtinDefaultContract = layout.buildDirectory.file(
        'intermediates/builtinIndex/default-contract.json')
def builtinIndexFile = layout.buildDirectory.file(
        'generated/resources/builtinIndex/assets/kinetic/builtin-index.json')
def builtinContainerFile = layout.buildDirectory.file(
        'generated/resources/builtinIndex/assets/kinetic/builtin-default.kinetic')
def builtinVerificationReceipt = layout.buildDirectory.file(
        'verification/builtinIndex/full-materialization.json')
def builtinToolLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(17)
}

def configureBuiltinToolTask = { BuiltinModelToolTask task, String command ->
    task.command.set(command)
    // forge-*-universal.jar 是带签名的原始发行包，而 moddev 已经把打过补丁、去掉签名的
    // forge 构件放进了 runtimeClasspath。两个都在时，JVM 会为前者做 jar 摘要校验，
    // 一旦环境差异导致摘要不符就抛 "SHA-384 digest error" 把工具进程直接打死（CI 复现过）。
    // 工具只需要类，这里把带签名的原始 universal 包排除掉。
    task.toolClasspath.from(providers.provider {
        sourceSets.builtinIndexTool.runtimeClasspath.files.findAll {
            !it.name.endsWith('-universal.jar')
        }
    })
    task.nativeLibrary.set(kineticNativeLibraryFile)
    task.operatingSystem.set(providers.systemProperty('os.name'))
    task.architecture.set(providers.systemProperty('os.arch'))
    task.javaExecutable.set(builtinToolLauncher.map {
        it.executablePath.asFile.absolutePath
    })
    task.javaRuntimeVersion.set(builtinToolLauncher.map {
        it.metadata.javaRuntimeVersion
    })
    task.javaVendor.set(builtinToolLauncher.map {
        it.metadata.vendor
    })
}

tasks.register('generateBuiltinDefaultContract', BuiltinModelToolTask) {
    group = 'build'
    description = 'Materializes the builtin intrinsic default (misc/2_steve) and generates its reusable identity contract.'
    dependsOn tasks.named('compileJava'), tasks.named('compileBuiltinIndexToolJava')
    configureBuiltinToolTask(delegate, BuiltinModelToolTask.GENERATE_DEFAULT_CONTRACT)
    sourceRoot.set(builtinDefaultRoot)
    sourceFiles.from(builtinDefaultRoot.asFileTree)
    resultFile.set(builtinDefaultContract)
    workDirectory.set(layout.buildDirectory.dir('tmp/generateBuiltinDefaultContract'))
}

tasks.register('generateBuiltinDefaultContainer', BuiltinModelToolTask) {
    group = 'build'
    description = 'Converts the builtin intrinsic default model at build time so startup does not re-parse 6 MB of animation JSON.'
    dependsOn tasks.named('compileJava'), tasks.named('compileBuiltinIndexToolJava')
    configureBuiltinToolTask(delegate, BuiltinModelToolTask.GENERATE_DEFAULT_CONTAINER)
    sourceRoot.set(builtinDefaultRoot)
    sourceFiles.from(builtinDefaultRoot.asFileTree)
    resultFile.set(builtinContainerFile)
    workDirectory.set(layout.buildDirectory.dir('tmp/generateBuiltinDefaultContainer'))
}

tasks.register('generateBuiltinModelIndex', BuiltinModelToolTask) {
    group = 'build'
    description = 'Scans builtin raw models and generates the production builtin index.'
    dependsOn tasks.named('generateBuiltinDefaultContract')
    configureBuiltinToolTask(delegate, BuiltinModelToolTask.GENERATE_INDEX)
    sourceRoot.set(builtinModelRoot)
    sourceFiles.from(builtinModelRoot.asFileTree)
    defaultContractFile.set(builtinDefaultContract)
    animationHistoryFile.set(builtinAnimationHistory)
    resultFile.set(builtinIndexFile)
    workDirectory.set(layout.buildDirectory.dir('tmp/generateBuiltinModelIndex'))
}

tasks.register('verifyBuiltinModelIndex', BuiltinModelToolTask) {
    group = 'verification'
    description = 'Fully converts and materializes every non-intrinsic-default builtin model.'
    dependsOn tasks.named('generateBuiltinModelIndex')
    configureBuiltinToolTask(delegate, BuiltinModelToolTask.VERIFY)
    sourceRoot.set(builtinModelRoot)
    sourceFiles.from(builtinModelRoot.asFileTree.matching {
        exclude builtinIntrinsicDefaultExclude
    })
    indexFile.set(builtinIndexFile)
    defaultContractFile.set(builtinDefaultContract)
    resultFile.set(builtinVerificationReceipt)
    workDirectory.set(layout.buildDirectory.dir('tmp/verifyBuiltinModelIndex'))
}

tasks.named('processResources') {
    dependsOn tasks.named('generateBuiltinModelIndex')
    dependsOn tasks.named('generateBuiltinDefaultContainer')
    from(builtinIndexFile) {
        into 'assets/kinetic'
    }
    from(builtinContainerFile) {
        into 'assets/kinetic'
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyBuiltinModelIndex')
}

tasks.withType(Jar).configureEach {
    if (name != 'relocateProcessorAsm') {
        dependsOn tasks.named('verifyBuiltinModelIndex')
    }
}
